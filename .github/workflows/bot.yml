name: bakaatsu-ir

on:
  schedule:
    # cronはUTC。JST 8:30〜20:00 平日（時間の細かい判定はコード側でやる）
    - cron: "*/5 23 * * 0-4"   # JST 8:00-8:55 月〜金
    - cron: "*/5 0-10 * * 1-5" # JST 9:00-19:55
    - cron: "0 11 * * 1-5"     # JST 20:00
  workflow_dispatch:
    inputs:
      date:
        description: "過去日を採点だけする（YYYYMMDD、空なら通常実行）"
        required: false

permissions:
  contents: write

concurrency:
  group: bakaatsu-ir
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCHLIST_YAML: ${{ secrets.WATCHLIST_YAML }}
          NOTIFY_THRESHOLD: ${{ vars.NOTIFY_THRESHOLD || '95' }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python -m bakaatsu.main --force --dry-run --date "$INPUT_DATE"
          else
            python -m bakaatsu.main
          fi

      - name: Save state
        if: always()
        run: |
          git config user.name "bakaatsu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "state update [skip ci]" && git push)
